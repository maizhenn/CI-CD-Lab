name: PowerShell CI

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run PowerShell script
        shell: pwsh
        run: ./Check-System.ps1

      - name: Run automated tests
        shell: pwsh
        run: ./Test-System.ps1
