name: PowerShell CI

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run PowerShell script
        shell: pwsh
        run: ./Check-System.ps1

      - name: Run automated tests
        shell: pwsh
        run: |
          Remove-Item Env:\COMPUTERNAME
          ./Test-System.ps1

      - name: Quality gate passed
        shell: pwsh
        run: Write-Host "All tests passed. Ready for deployment."
